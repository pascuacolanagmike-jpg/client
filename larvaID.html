<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LarvaID · Species Classification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0F3D2E;
            --primary-light: #1A5C46;
            --primary-soft: #E8F3EF;
            --accent: #2E7D6B;
            --background: #F5F7FA;
            --surface: #FFFFFF;
            --text: #1A2A25;
            --text-secondary: #5F7470;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --mosquito-green: #1B5E20;
            --mosquito-dark: #0D3328;
            --mosquito-accent: #4CAF50;
            --warning-amber: #FF8F00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EDF2F0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0.5rem;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            padding: 1rem 0.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid rgba(76,175,80,0.2);
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.2rem 0;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            background: var(--primary-soft);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mosquito-green);
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:active { transform: scale(0.9); background: #D5E8E0; }
        .back-btn i { font-size: 1.1rem; }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--mosquito-green);
        }

        .camera-section {
            background: #0D3328;
            border-radius: 16px;
            padding: 0.6rem;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(76,175,80,0.3);
        }

        .camera-preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #081511;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(76,175,80,0.4);
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #imagePreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
        }

        .camera-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #A5D6A7;
            gap: 8px;
            font-size: 0.8rem;
            text-align: center;
            padding: 1rem;
        }

        .camera-placeholder i { font-size: 2.5rem; opacity: 0.7; color: #4CAF50; }

        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 0.7rem;
            flex-wrap: wrap;
        }

        .btn-cam {
            background: white;
            border: none;
            border-radius: 50px;
            padding: 0.6rem 0.8rem;
            font-weight: 600;
            font-size: 0.7rem;
            color: var(--mosquito-green);
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #C8E6C9;
            box-shadow: var(--shadow-sm);
            min-height: 40px;
            justify-content: center;
        }

        .btn-cam:active { transform: scale(0.95); background: #E8F5E9; }
        .btn-cam.primary { background: var(--mosquito-green); color: white; border-color: var(--mosquito-green); }
        .btn-cam.primary:active { background: var(--mosquito-dark); }
        .btn-cam i { font-size: 0.85rem; }
        .btn-cam:disabled { opacity: 0.55; cursor: not-allowed; }

        .results-section {
            background: #FAFCFB;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 0.8rem;
        }

        .results-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--mosquito-green);
            margin-bottom: 0.6rem;
        }

        .result-table { width: 100%; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        .result-table thead { background: var(--mosquito-green); color: white; }
        .result-table th { padding: 0.55rem 0.6rem; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; text-align: left; }
        .result-table td { padding: 0.6rem; font-size: 0.8rem; color: var(--text); border-bottom: 1px solid #EFF3F2; font-weight: 500; }
        .result-table tbody tr:last-child td { border-bottom: none; }
        .result-table tbody tr:nth-child(even) { background: #F9FBF9; }
        .result-value { font-weight: 700; color: var(--mosquito-green); }

        .status-bar {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.35rem;
            border-radius: 30px;
            background: #F5F7F6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .status-bar i { font-size: 0.45rem; }

        .hidden { display: none !important; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 0.8rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #E0E0E0;
            border-top: 4px solid var(--mosquito-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* Morphological section */
        .morpho-section {
            background: #F0F7F4;
            border-radius: 16px;
            padding: 0.8rem;
            border: 1px solid #D0E5DC;
        }
        .morpho-header {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--mosquito-green);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .morpho-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .morpho-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .morpho-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .morpho-select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid #C8E6C9;
            background: white;
            font-size: 0.8rem;
            color: var(--text);
            outline: none;
        }
        .morpho-select:focus {
            border-color: var(--mosquito-accent);
            box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn" title="Back to Dashboard"><i class="fas fa-arrow-left"></i></a>
            <span class="header-title">LarvaID</span>
        </div>

        <div class="camera-section">
            <div class="camera-preview-wrapper">
                <video id="cameraStream" autoplay playsinline muted></video>
                <img id="imagePreview" alt="Captured larva image">
                <div class="camera-placeholder" id="cameraPlaceholder">
                    <i class="fas fa-camera"></i>
                    <span>Point camera at larva</span>
                </div>
            </div>
            <div class="camera-controls">
                <button class="btn-cam primary" id="startCameraBtn"><i class="fas fa-play"></i> Live</button>
                <button class="btn-cam" id="captureBtn"><i class="fas fa-camera"></i> Capture</button>
                <button class="btn-cam" id="uploadBtn"><i class="fas fa-image"></i> Image</button>
                <input type="file" id="imageInput" accept="image/*" hidden>
                <button class="btn-cam" id="analyzeBtn"><i class="fas fa-microscope"></i> Analyze</button>
                <button class="btn-cam" id="stopCameraBtn"><i class="fas fa-stop"></i> Stop</button>
            </div>
        </div>

        <!-- Morphological Observations Section -->
        <div class="morpho-section">
            <div class="morpho-header">
                <i class="fas fa-eye"></i> Morphological Observations (optional)
            </div>
            <div class="morpho-grid">
                <div class="morpho-row">
                    <label class="morpho-label">Water surface orientation</label>
                    <select id="orientationSelect" class="morpho-select">
                        <option value="">Not observed</option>
                        <option value="flat">Lies flat / parallel</option>
                        <option value="angle45">Hangs diagonally (~45°)</option>
                        <option value="steep">Hangs steeply / vertical</option>
                    </select>
                </div>
                <div class="morpho-row">
                    <label class="morpho-label">Siphon projection (tail tube)</label>
                    <select id="siphonSelect" class="morpho-select">
                        <option value="">Not observed</option>
                        <option value="none">No visible tube</option>
                        <option value="short">Short, dark stub</option>
                        <option value="long">Long, thin tube</option>
                    </select>
                </div>
                <div class="morpho-row">
                    <label class="morpho-label">Movement & thrashing pattern</label>
                    <select id="movementSelect" class="morpho-select">
                        <option value="">Not observed</option>
                        <option value="darting">Horizontal darting</option>
                        <option value="s-shaped">S-shaped wiggling</option>
                        <option value="jerky">Jerky, wriggling</option>
                    </select>
                </div>
                <div class="morpho-row">
                    <label class="morpho-label">Resting position in container</label>
                    <select id="restingSelect" class="morpho-select">
                        <option value="">Not observed</option>
                        <option value="edges">Gathers along edges/rim</option>
                        <option value="open_water">Hangs in open water</option>
                        <option value="clusters">Clusters near surface</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header"><i class="fas fa-table"></i><span>Classification Results</span></div>
            <table class="result-table">
                <thead><tr><th>Parameter</th><th>Result</th></tr></thead>
                <tbody>
                    <tr><td>Species</td><td><span class="result-value" id="speciesResult">--</span></td></tr>
                    <tr><td>AI Confidence</td><td><span class="result-value" id="aiConfidenceResult">--</span></td></tr>
                    <tr><td>Rule Assessment</td><td><span class="result-value" id="ruleAssessmentResult">--</span></td></tr>
                    <tr><td>Timestamp</td><td><span class="result-value" id="timestampResult">--</span></td></tr>
                </tbody>
            </table>
        </div>

        <div class="status-bar" id="statusMessage"><i class="fas fa-circle"></i> Ready</div>
    </div>

    <div class="overlay" id="analysisOverlay">
        <div class="loader"></div>
        <div style="font-weight:600; color:#1B5E20;">Analyzing larva...</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // DOM elements
            const video = document.getElementById('cameraStream');
            const imagePreview = document.getElementById('imagePreview');
            const cameraPlaceholder = document.getElementById('cameraPlaceholder');
            const startBtn = document.getElementById('startCameraBtn');
            const captureBtn = document.getElementById('captureBtn');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const stopBtn = document.getElementById('stopCameraBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const imageInput = document.getElementById('imageInput');
            const statusMsg = document.getElementById('statusMessage');
            const speciesResult = document.getElementById('speciesResult');
            const aiConfidenceResult = document.getElementById('aiConfidenceResult');
            const ruleAssessmentResult = document.getElementById('ruleAssessmentResult');
            const timestampResult = document.getElementById('timestampResult');
            const analysisOverlay = document.getElementById('analysisOverlay');
            const toast = document.getElementById('toast');

            // Morphological selectors
            const orientationSelect = document.getElementById('orientationSelect');
            const siphonSelect = document.getElementById('siphonSelect');
            const movementSelect = document.getElementById('movementSelect');
            const restingSelect = document.getElementById('restingSelect');

            let stream = null;
            let capturedImage = null;

            const ROBOFLOW_URL = 'https://serverless.roboflow.com/larva-aedes/1?api_key=tytdJy91mpGDBEiW4mTi';
            const CONTROL_CENTER_URL = 'https://panel-control-1ric.onrender.com/api/ingest';
            const DEVICE_ID = 'LARVAID-001';

            // Class mapping (numeric IDs to species)
            const CLASS_ID_MAPPING = {
                0: 'aedes',
                1: 'anopheles',
                2: 'culex'
            };

            const ALLOWED_LARVA = ['negative', 'aedes', 'culex', 'anopheles', 'mixed'];

            function mapToAllowedSpecies(rawClass) {
                const rawStr = String(rawClass);
                if (/^\d+$/.test(rawStr)) {
                    const classId = parseInt(rawStr, 10);
                    if (CLASS_ID_MAPPING.hasOwnProperty(classId)) {
                        return CLASS_ID_MAPPING[classId];
                    }
                    console.warn('Unknown numeric class ID:', classId);
                    return 'unknown';
                }
                const lower = rawStr.toLowerCase().replace(/[^a-z]/g, '');
                if (ALLOWED_LARVA.includes(lower)) return lower;
                if (lower.includes('aedes')) return 'aedes';
                if (lower.includes('culex')) return 'culex';
                if (lower.includes('anopheles')) return 'anopheles';
                if (lower.includes('negative')) return 'negative';
                if (lower.includes('mixed')) return 'mixed';
                return 'unknown';
            }

            // Rule-based scoring
            function getRuleBasedSpecies() {
                const scores = { aedes: 0, anopheles: 0, culex: 0 };
                const observations = [];

                // Orientation
                const orient = orientationSelect.value;
                if (orient === 'flat') { scores.anopheles++; observations.push('flat orientation'); }
                else if (orient === 'angle45') { scores.aedes++; observations.push('45° angle'); }
                else if (orient === 'steep') { scores.culex++; observations.push('steep angle'); }

                // Siphon
                const siphon = siphonSelect.value;
                if (siphon === 'none') { scores.anopheles++; observations.push('no siphon'); }
                else if (siphon === 'short') { scores.aedes++; observations.push('short siphon'); }
                else if (siphon === 'long') { scores.culex++; observations.push('long siphon'); }

                // Movement
                const movement = movementSelect.value;
                if (movement === 'darting') { scores.anopheles++; observations.push('darting movement'); }
                else if (movement === 's-shaped') { scores.aedes++; observations.push('S-shaped movement'); }
                else if (movement === 'jerky') { scores.culex++; observations.push('jerky movement'); }

                // Resting
                const resting = restingSelect.value;
                if (resting === 'edges') { scores.anopheles++; observations.push('rests at edges'); }
                else if (resting === 'open_water') { scores.aedes++; observations.push('rests in open water'); }
                else if (resting === 'clusters') { scores.culex++; observations.push('rests in clusters'); }

                // Determine highest score
                let maxScore = 0;
                let ruleSpecies = null;
                for (const [species, score] of Object.entries(scores)) {
                    if (score > maxScore) {
                        maxScore = score;
                        ruleSpecies = species;
                    }
                }

                if (maxScore === 0) {
                    return { species: null, score: 0, details: 'No morphological data' };
                }
                // If tie, return null (ambiguous)
                const tied = Object.values(scores).filter(s => s === maxScore).length > 1;
                if (tied) {
                    return { species: null, score: maxScore, details: 'Tie between species' };
                }
                return { species: ruleSpecies, score: maxScore, details: observations.join(', ') };
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            function updateStatus(msg, color = '#5F7470') {
                statusMsg.innerHTML = `<i class="fas fa-circle" style="color: ${color};"></i> ${msg}`;
            }

            function setAnalysisLoading(loading) {
                analysisOverlay.classList.toggle('active', loading);
                [captureBtn, uploadBtn, startBtn, stopBtn, analyzeBtn].forEach(btn => btn.disabled = loading);
                analyzeBtn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> Analyzing' : '<i class="fas fa-microscope"></i> Analyze';
            }

            function showImagePreview(dataUrl) {
                capturedImage = dataUrl;
                imagePreview.src = dataUrl;
                imagePreview.style.display = 'block';
                video.style.display = 'none';
                cameraPlaceholder.style.display = 'none';
            }

            function clearImagePreview() {
                capturedImage = null;
                imagePreview.style.display = 'none';
                cameraPlaceholder.style.display = 'flex';
            }

            async function startCamera() {
                stopStream();
                if (!navigator.mediaDevices?.getUserMedia) {
                    showToast('Camera requires HTTPS or localhost');
                    return;
                }
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 1280 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    cameraPlaceholder.style.display = 'none';
                    imagePreview.style.display = 'none';
                    capturedImage = null;
                    updateStatus('Camera active', '#1B5E20');
                } catch (err) {
                    console.error(err);
                    showToast('Camera permission denied');
                }
            }

            function stopStream() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                video.style.display = 'none';
                if (!capturedImage) {
                    cameraPlaceholder.style.display = 'flex';
                    imagePreview.style.display = 'none';
                }
                updateStatus('Camera off', '#8A9E98');
            }

            function captureImage() {
                if (!stream || !video.srcObject) {
                    showToast('Please start the camera first');
                    return;
                }
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 640;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                showImagePreview(dataUrl);
                updateStatus('Image captured', '#1B5E20');
                showToast('Image captured');
            }

            function uploadImage(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    showImagePreview(ev.target.result);
                    updateStatus('Image loaded', '#1B5E20');
                    showToast('Image loaded');
                };
                reader.readAsDataURL(file);
                imageInput.value = '';
            }

            async function analyzeImage() {
                if (!capturedImage) {
                    showToast('Please capture or upload an image first');
                    return;
                }
                setAnalysisLoading(true);
                updateStatus('Analyzing...', '#1565C0');
                try {
                    // AI classification
                    const base64 = capturedImage.split(',')[1];
                    const byteChars = atob(base64);
                    const byteNums = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
                    const blob = new Blob([new Uint8Array(byteNums)], { type: 'image/jpeg' });
                    const formData = new FormData();
                    formData.append('file', blob, 'larva.jpg');

                    const resp = await fetch(ROBOFLOW_URL, {
                        method: 'POST',
                        body: formData
                    });
                    if (!resp.ok) {
                        const errText = await resp.text().catch(() => '');
                        throw new Error(`Roboflow error ${resp.status}${errText ? ': ' + errText : ''}`);
                    }
                    const data = await resp.json();
                    console.log('Roboflow response:', data);

                    const predictions = data.predictions || [];
                    if (predictions.length === 0) {
                        speciesResult.textContent = 'None';
                        aiConfidenceResult.textContent = '--';
                        ruleAssessmentResult.textContent = '--';
                        timestampResult.textContent = '--';
                        updateStatus('No species detected', '#E65100');
                        showToast('No species detected');
                        return;
                    }

                    // Choose prediction with highest confidence
                    let topPrediction = predictions[0];
                    for (const pred of predictions) {
                        if ((pred.confidence || 0) > (topPrediction.confidence || 0)) {
                            topPrediction = pred;
                        }
                    }

                    let rawClass = topPrediction.class;
                    if (rawClass === undefined && topPrediction.class_id !== undefined) {
                        rawClass = topPrediction.class_id;
                    }
                    console.log('Raw class value:', rawClass, 'Type:', typeof rawClass);

                    const aiSpecies = mapToAllowedSpecies(rawClass);
                    console.log('AI species:', aiSpecies);

                    let confidence = topPrediction.confidence || 0;
                    if (confidence > 1) {
                        confidence = confidence.toFixed(1);
                    } else {
                        confidence = (confidence * 100).toFixed(1);
                    }
                    aiConfidenceResult.textContent = `${confidence}%`;

                    // Rule-based assessment
                    const ruleResult = getRuleBasedSpecies();
                    console.log('Rule result:', ruleResult);

                    let finalSpecies = aiSpecies;
                    let ruleDisplay = ruleResult.details || 'No data';
                    if (ruleResult.species && ruleResult.score > 0) {
                        // If rule-based confidence is strong (>=2 features) and AI is uncertain (<70%) or different, override
                        if (ruleResult.score >= 2 || parseFloat(confidence) < 70) {
                            finalSpecies = ruleResult.species;
                            ruleDisplay = `Rule override: ${ruleResult.details}`;
                        } else {
                            ruleDisplay = `Rules suggest ${ruleResult.species}, but AI kept ${aiSpecies}`;
                        }
                    }
                    ruleAssessmentResult.textContent = ruleDisplay;

                    speciesResult.textContent = finalSpecies;
                    timestampResult.textContent = new Date().toLocaleTimeString();

                    // Send final species to Control Center
                    updateStatus('Sending to Control Center...', '#1565C0');
                    const sendResult = await sendLarvaId(finalSpecies);
                    if (sendResult.success) {
                        updateStatus('Larva ID sent', '#1B5E20');
                        showToast('Larva ID sent to Control Center');
                    } else {
                        updateStatus('Analysis complete, sync failed', '#E65100');
                        showToast('Sync failed: ' + sendResult.error);
                    }
                } catch (err) {
                    console.error(err);
                    updateStatus('Analysis failed', '#C62828');
                    showToast('Analysis failed: ' + err.message);
                } finally {
                    setAnalysisLoading(false);
                }
            }

            async function sendLarvaId(larvaId) {
                if (!navigator.geolocation) return { success: false, error: 'Geolocation not supported' };
                return new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const payload = {
                            deviceId: DEVICE_ID,
                            timestamp: new Date().toISOString(),
                            larvaId: larvaId,
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            radius: 500
                        };
                        console.log('Sending payload:', payload);
                        try {
                            const resp = await fetch(CONTROL_CENTER_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (!resp.ok) {
                                const errText = await resp.text().catch(() => '');
                                throw new Error(`HTTP ${resp.status}${errText ? ': ' + errText : ''}`);
                            }
                            const result = await resp.json();
                            console.log('Control Center response:', result);
                            resolve({ success: true, result });
                        } catch (err) {
                            console.error('Error sending to Control Center:', err);
                            resolve({ success: false, error: err.message });
                        }
                    }, (err) => {
                        console.error('Geolocation error:', err);
                        resolve({ success: false, error: 'Location permission denied' });
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    });
                });
            }

            // Event listeners
            startBtn.addEventListener('click', startCamera);
            stopBtn.addEventListener('click', stopStream);
            captureBtn.addEventListener('click', captureImage);
            uploadBtn.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', uploadImage);
            analyzeBtn.addEventListener('click', analyzeImage);
            window.addEventListener('beforeunload', stopStream);

            // Initial state
            stopStream();
        })();
    </script>
</body>
