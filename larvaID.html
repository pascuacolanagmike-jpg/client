<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LarvaID · Species Classification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0F3D2E;
            --primary-light: #1A5C46;
            --primary-soft: #E8F3EF;
            --accent: #2E7D6B;
            --background: #F5F7FA;
            --surface: #FFFFFF;
            --text: #1A2A25;
            --text-secondary: #5F7470;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 12px;
            --mosquito-green: #1B5E20;
            --mosquito-dark: #0D3328;
            --mosquito-accent: #4CAF50;
            --warning-amber: #FF8F00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #EDF2F0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
            -webkit-tap-highlight-color: transparent;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background-image: radial-gradient(circle at 20% 30%, rgba(76,175,80,0.03) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(76,175,80,0.03) 0%, transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            padding: 1.5rem 1.2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            border: 1px solid rgba(76,175,80,0.2);
            position: relative;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.2rem 0;
            flex-shrink: 0;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--primary-soft);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mosquito-green);
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            flex-shrink: 0;
            text-decoration: none;
        }
        .back-btn:active {
            transform: scale(0.9);
            background: #D5E8E0;
        }
        .back-btn i {
            font-size: 1.2rem;
        }
        .header-title {
            flex: 1;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--mosquito-green);
        }
        .header-badge {
            background: var(--primary-soft);
            padding: 0.4rem 0.7rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--mosquito-green);
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(76,175,80,0.2);
            flex-shrink: 0;
        }
        .header-badge i {
            font-size: 0.7rem;
        }

        /* Camera Section */
        .camera-section {
            background: #0D3328;
            border-radius: var(--radius-md);
            padding: 0.7rem;
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
            border: 1px solid rgba(76,175,80,0.3);
        }
        .camera-preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #081511;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(76,175,80,0.4);
        }
        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #cameraCanvas {
            display: none;
        }
        .camera-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #A5D6A7;
            gap: 10px;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .camera-placeholder i {
            font-size: 3rem;
            opacity: 0.7;
            color: #4CAF50;
        }
        .camera-controls {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }
        .btn-cam {
            background: white;
            border: none;
            border-radius: 50px;
            padding: 0.7rem 1rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--mosquito-green);
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #C8E6C9;
            box-shadow: var(--shadow-sm);
        }
        .btn-cam:active {
            transform: scale(0.95);
            background: #E8F5E9;
        }
        .btn-cam.primary {
            background: var(--mosquito-green);
            color: white;
            border-color: var(--mosquito-green);
        }
        .btn-cam.primary:active {
            background: var(--mosquito-dark);
        }
        .btn-cam i {
            font-size: 1rem;
        }

        /* Results Section */
        .results-section {
            background: #FAFCFB;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            padding: 1rem;
            flex-shrink: 0;
        }
        .results-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--mosquito-green);
            margin-bottom: 0.8rem;
        }
        .results-header i {
            font-size: 1.2rem;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .result-table thead {
            background: var(--mosquito-green);
            color: white;
        }
        .result-table th {
            padding: 0.7rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }
        .result-table td {
            padding: 0.8rem;
            font-size: 0.9rem;
            color: var(--text);
            border-bottom: 1px solid #EFF3F2;
            font-weight: 500;
        }
        .result-table tbody tr:last-child td {
            border-bottom: none;
        }
        .result-table tbody tr {
            background: white;
            transition: background 0.2s;
        }
        .result-table tbody tr:nth-child(even) {
            background: #F9FBF9;
        }
        .result-value {
            font-weight: 700;
            color: var(--mosquito-green);
        }
        .result-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #E8F5E9;
            color: var(--mosquito-green);
        }
        .result-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.8rem;
        }
        .result-status i {
            color: var(--mosquito-accent);
            font-size: 0.7rem;
        }

        /* Status Bar */
        .status-bar {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.4rem;
            border-radius: 30px;
            background: #F5F7F6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .status-bar i {
            font-size: 0.5rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            background: white;
            border-radius: 24px;
            padding: 2rem 1.5rem 1.5rem;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-icon {
            width: 60px;
            height: 60px;
            background: #E8F5E9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: var(--mosquito-green);
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--mosquito-green);
            margin-bottom: 0.7rem;
        }
        .modal-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }
        .modal-close-btn {
            background: var(--mosquito-green);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .modal-close-btn:active {
            background: var(--mosquito-dark);
        }

        @media (max-width: 380px) {
            .app-container {
                padding: 1rem 0.8rem 1.5rem;
            }
            .header-title {
                font-size: 1.1rem;
            }
            .btn-cam {
                padding: 0.6rem 0.8rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="#" class="back-btn" onclick="history.back()" title="Back to Dashboard">
                <i class="fas fa-arrow-left"></i>
            </a>
            <span class="header-title">LarvaID</span>
            <div class="header-badge">
                <i class="fas fa-dna"></i>
                <span>AI</span>
            </div>
        </div>

        <!-- Camera Section -->
        <div class="camera-section">
            <div class="camera-preview-wrapper">
                <video id="cameraStream" autoplay playsinline muted></video>
                <canvas id="cameraCanvas"></canvas>
                <div class="camera-placeholder" id="cameraPlaceholder">
                    <i class="fas fa-camera"></i>
                    <span>Point camera at larva</span>
                </div>
            </div>
            <div class="camera-controls">
                <button class="btn-cam primary" id="startCameraBtn"><i class="fas fa-play"></i> Start</button>
                <button class="btn-cam" id="captureBtn"><i class="fas fa-camera"></i> Capture</button>
                <button class="btn-cam" id="analyzeBtn"><i class="fas fa-microscope"></i> Analyze</button>
                <button class="btn-cam" id="stopCameraBtn"><i class="fas fa-stop"></i> Stop</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <i class="fas fa-table"></i>
                <span>Classification Results</span>
            </div>
            <table class="result-table">
                <thead>
                    <tr>
                        <th>Parameter</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Species</td>
                        <td><span class="result-value" id="speciesResult">--</span> <span class="result-badge" id="speciesBadge" style="display:none;">Detected</span></td>
                    </tr>
                    <tr>
                        <td>Estimated Age</td>
                        <td><span class="result-value" id="ageResult">--</span></td>
                    </tr>
                    <tr>
                        <td>Confidence</td>
                        <td><span class="result-value" id="confidenceResult">--</span></td>
                    </tr>
                    <tr>
                        <td>Timestamp</td>
                        <td><span class="result-value" id="timestampResult">--</span></td>
                    </tr>
                </tbody>
            </table>
            <div class="result-status" id="resultStatus">
                <i class="fas fa-circle"></i>
                <span>Awaiting analysis...</span>
            </div>
        </div>

        <div class="status-bar" id="statusMessage">
            <i class="fas fa-circle"></i> Camera ready
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon"><i class="fas fa-dna"></i></div>
            <div class="modal-title" id="modalTitle">LarvaID</div>
            <div class="modal-message" id="modalMessage">Details here.</div>
            <button class="modal-close-btn" id="modalCloseBtn">Acknowledge</button>
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('cameraCanvas');
            const cameraPlaceholder = document.getElementById('cameraPlaceholder');
            const startBtn = document.getElementById('startCameraBtn');
            const captureBtn = document.getElementById('captureBtn');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const stopBtn = document.getElementById('stopCameraBtn');
            const statusMsg = document.getElementById('statusMessage');
            const resultStatus = document.getElementById('resultStatus');
            
            // Result elements
            const speciesResult = document.getElementById('speciesResult');
            const speciesBadge = document.getElementById('speciesBadge');
            const ageResult = document.getElementById('ageResult');
            const confidenceResult = document.getElementById('confidenceResult');
            const timestampResult = document.getElementById('timestampResult');

            // Modal elements
            const modalOverlay = document.getElementById('modalOverlay');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            let stream = null;
            let capturedImage = null;

            function showModal(icon, title, message) {
                modalIcon.innerHTML = `<i class="fas ${icon}"></i>`;
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalOverlay.classList.add('active');
            }

            function hideModal() {
                modalOverlay.classList.remove('active');
            }

            modalCloseBtn.addEventListener('click', hideModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) hideModal();
            });

            function updateStatus(text, color = '#5F7470') {
                statusMsg.innerHTML = `<i class="fas fa-circle" style="color: ${color};"></i> ${text}`;
            }

            function updateResultStatus(text, color = '#5F7470') {
                resultStatus.innerHTML = `<i class="fas fa-circle" style="color: ${color};"></i> ${text}`;
            }

            function stopStream() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                video.style.display = 'none';
                cameraPlaceholder.style.display = 'flex';
                updateStatus('Camera off', '#8A9E98');
            }

            async function startCamera() {
                stopStream();
                if (!navigator.mediaDevices?.getUserMedia) {
                    showModal('fa-exclamation-triangle', 'Camera Unavailable', 'Camera access requires HTTPS or localhost.');
                    return;
                }
                try {
                    const constraints = {
                        audio: false,
                        video: { 
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1080 },
                            height: { ideal: 1080 }
                        }
                    };
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.style.display = 'block';
                    cameraPlaceholder.style.display = 'none';
                    updateStatus('Camera active', '#1B5E20');
                } catch (error) {
                    console.error(error);
                    showModal('fa-lock', 'Permission Required', 'Camera permission was denied. Please allow access in your browser settings.');
                    updateStatus('Camera unavailable', '#E65100');
                }
            }

            function captureImage() {
                if (!stream || !video.srcObject) {
                    showModal('fa-exclamation-circle', 'No Camera', 'Please start the camera first before capturing.');
                    return;
                }
                
                const videoWidth = video.videoWidth;
                const videoHeight = video.videoHeight;
                
                canvas.width = videoWidth;
                canvas.height = videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, videoWidth, videoHeight);
                
                capturedImage = canvas.toDataURL('image/jpeg', 0.9);
                
                updateStatus('Image captured', '#1B5E20');
                updateResultStatus('Image captured · ready for analysis', '#1B5E20');
                
                showModal('fa-check-circle', 'Capture Successful', 'Larva image has been captured and is ready for analysis. Press "Analyze" to process.');
            }

            function analyzeImage() {
                if (!capturedImage) {
                    showModal('fa-exclamation-circle', 'No Image', 'Please capture an image first using the "Capture" button.');
                    return;
                }
                
                updateStatus('Analyzing...', '#1565C0');
                updateResultStatus('Processing image...', '#1565C0');
                
                // Simulate AI processing
                setTimeout(() => {
                    // Simulated results
                    const species = ['Aedes aegypti', 'Aedes albopictus', 'Culex quinquefasciatus', 'Anopheles stephensi'];
                    const randomSpecies = species[Math.floor(Math.random() * species.length)];
                    const randomAge = (Math.random() * 5 + 1).toFixed(1);
                    const randomConfidence = (Math.random() * 15 + 85).toFixed(1);
                    
                    speciesResult.textContent = randomSpecies;
                    speciesBadge.style.display = 'inline-block';
                    speciesBadge.textContent = 'Detected';
                    ageResult.textContent = `${randomAge} days`;
                    confidenceResult.textContent = `${randomConfidence}%`;
                    timestampResult.textContent = new Date().toLocaleTimeString();
                    
                    updateStatus('Analysis complete', '#1B5E20');
                    updateResultStatus('Analysis complete · results displayed', '#1B5E20');
                    
                    showModal('fa-dna', 'Analysis Complete', `Species: ${randomSpecies}\nEstimated Age: ${randomAge} days\nConfidence: ${randomConfidence}%`);
                }, 2000);
            }

            startBtn.addEventListener('click', startCamera);
            stopBtn.addEventListener('click', () => { 
                stopStream(); 
                updateStatus('Camera stopped', '#8A9E98');
            });
            captureBtn.addEventListener('click', captureImage);
            analyzeBtn.addEventListener('click', analyzeImage);

            // Cleanup on page unload
            window.addEventListener('beforeunload', stopStream);
            stopStream();
        })();
    </script>
</body>
</html>
